# Posts commits that add photos under posts/ to @mokalauver on Instagram.
# The real logic lives in illitlauver/hub. Runs in dry-run (preview) mode
# until this repo has a variable POST_LIVE=true.
name: Post to Instagram

on:
  push:
    branches: [main]
    paths: ['posts/**']
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to post (blank = latest commit)
        required: false
        default: ''

jobs:
  post:
    permissions:
      contents: write
    uses: illitlauver/hub/.github/workflows/post.yml@main
    with:
      dry_run: ${{ vars.POST_LIVE != 'true' }}
      sha: ${{ inputs.sha || '' }}
    secrets:
      ig_access_token: ${{ secrets.IG_TOKEN_MOKA }}
